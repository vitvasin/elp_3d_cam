# ELP 3D stereo camera tool — default configuration

camera:
  # Substring matched against /dev/v4l/by-id/ symlink names to find the ELP.
  device_match: "3D_USB_Camera"
  # Manual override: explicit /dev/videoN path, or null for auto-detect.
  device_override: null
  # Full side-by-side frame size (left|right concatenated). 2560x720 = 2x 1280x720.
  frame_width: 2560
  frame_height: 720
  fourcc: "MJPG"
  fps: 30

calibration:
  # Where calibration results are written / auto-loaded from on startup.
  output_path: "config/stereo_calib.yaml"

  chessboard:
    # Inner-corner counts (columns x rows), NOT square counts.
    cols: 9
    rows: 6
    square_size_mm: 25.0

  charuco:
    squares_x: 5
    squares_y: 7
    square_len_mm: 30.0
    marker_len_mm: 22.0
    # aruco predefined dictionary name (cv2.aruco.DICT_*).
    dictionary: "DICT_4X4_50"

  circle_grid:
    # cols = circles per row, rows = number of rows.
    # Standard asymmetric board is 4 x 11.
    cols: 4
    rows: 11
    # Spacing between adjacent circles in mm (see cv2.findCirclesGrid docs).
    spacing_mm: 20.0
    # true = asymmetric (recommended for stereo), false = symmetric.
    asymmetric: true

depth:
  # Compute backend.
  #   sgbm - CPU OpenCV StereoSGBM (works everywhere, single-threaded)
  #   vpi  - NVIDIA VPI on Jetson (OFA hardware = near-zero CPU/GPU usage)
  engine: "vpi"

  # VPI-specific settings (used when engine: "vpi").
  vpi:
    # Backend: "OFA" (dedicated stereo HW, fastest, best for Orin) or "CUDA".
    # Avoid CUDA on 4 GB Orin Nano at >= 720p (OOM under memory pressure).
    backend: "OFA"
    # PVA+NVENC+VIC quality knob, 1..8. Ignored by OFA/CUDA but harmless.
    quality: 6

  sgbm:
    min_disparity: 0
    num_disparities: 128   # must be divisible by 16
    block_size: 5
    uniqueness_ratio: 10
    speckle_window_size: 100
    speckle_range: 2
    disp12_max_diff: 1
    # P1/P2 smoothness: computed as multiplier * block_size^2 * channels if null.
    p1: null
    p2: null
    # SGBM aggregation mode. Trades CPU for quality.
    #   HH        - 8-direction, slowest, highest quality (~2x slower than SGBM)
    #   SGBM      - 5-direction, OpenCV default
    #   SGBM_3WAY - 3-direction, fastest (~3x faster than HH), slight quality drop
    #   HH4       - 4-direction (OpenCV >= 4.5)
    mode: "SGBM_3WAY"
  use_wls_filter: false
  wls_lambda: 8000.0
  wls_sigma: 1.5
  # Subpixel disparity resolution (px) used for depth uncertainty: SGBM = 1/16 px.
  subpixel_delta_disparity: 0.0625
  # Depth cap (mm). Pixels outside this range are masked invalid; visualization
  # gradient maps min→max across the colormap. Adjustable from the GUI.
  min_depth_mm: 50
  max_depth_mm: 3000
  # Temporal averaging over N frames. 1 = off. Higher = cleaner depth for slow
  # or static scenes (noise drops as 1/sqrt(N)). Adds N-frame latency.
  temporal_frames: 1
